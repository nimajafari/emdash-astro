# Build scripts: allow only what each runtime needs; rest false so
# strictDepBuilds (pnpm >=10.26 / 11) passes.
allowBuilds:
  esbuild: true
  sharp: true
  workerd: false

# Supply-chain hardening: cooldown on brand-new releases (EmDash exempt)
# and no non-registry transitive sources. (No trustPolicy: no-downgrade --
# it trips on upstream provenance regressions we don't control.)
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - emdash
  - "@emdash-cms/*"
blockExoticSubdeps: true

# @astrojs/check's WASM type checker (astro2tsx) ships @emnapi/core 1.x but
# leaves @emnapi/runtime to peer resolution, which picks 2.0.0-beta.2. That
# mismatch crashes `astro check` on load ("this.bridge.setLastError is not a
# function"). Give astro2tsx a matching runtime of its own.
packageExtensions:
  "@astrojs/astro2tsx@0.1":
    dependencies:
      "@emnapi/runtime": 1.11.3
